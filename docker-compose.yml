# ─────────────────────────────────────────────────────────────────────────────
# ADVERSA Platform — Docker Compose
#
# Profiles:
#   prod  →  make up          (production image, port 3000)
#   dev   →  make dev-up      (hot-reload mount, port 3001)
#
# Env vars are loaded from .env.local (create from .env.example)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Production ──────────────────────────────────────────────────────────────
  adversa:
    container_name: adversa-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: adversa:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Server-side secret — passed at runtime, never baked into the image
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    profiles: [prod]

  # ── Development (hot reload) ─────────────────────────────────────────────────
  adversa-dev:
    container_name: adversa-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps           # Only install deps; source is mounted
    image: adversa:dev
    working_dir: /app
    command: npm run dev
    ports:
      - "${DEV_PORT:-3001}:3000"
    volumes:
      # Mount source for hot reload; preserve container's node_modules
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    profiles: [dev]
